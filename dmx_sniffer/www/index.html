<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMX Sniffer</title>
<style>
/* =====================================================================
   RESET & BASE
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;overflow:hidden}
input,select,button,textarea{font:inherit;color:inherit}
a{color:#58a6ff;text-decoration:none}

/* =====================================================================
   LAYOUT
   ===================================================================== */
.app{display:flex;flex-direction:column;height:100vh}
.header{background:#161b22;padding:12px 24px;display:flex;align-items:center;border-bottom:1px solid #30363d;flex-shrink:0;position:relative}
.header h1{font-size:1.4em;font-weight:700;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.header .status{margin-left:auto;font-size:.8em;color:#b0b8c1;display:flex;align-items:center;gap:6px}
.header .dot{width:8px;height:8px;border-radius:50%;background:#f85149}
.header .dot.on{background:#3fb950}
.tabs{display:flex;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
.tab{flex:1;padding:12px 16px;text-align:center;cursor:pointer;font-size:.9em;font-weight:500;color:#b0b8c1;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tab:hover{color:#e6edf3;background:#1c2128}
.tab.active{color:#e6edf3;border-bottom-color:#58a6ff;background:#1c2128}
.panels{flex:1;overflow-y:auto;padding:20px 24px;width:100%;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* =====================================================================
   CARDS
   ===================================================================== */
.card{background:#161b22;border:2px solid #444c56;border-radius:8px;padding:16px 20px;margin-bottom:12px}
.card h3{font-size:1.1em;font-weight:700;color:#58a6ff;margin-bottom:14px;text-align:center;justify-content:center}
.card h3.warn{color:#d29922}
.card h3.danger{color:#f85149}

/* =====================================================================
   FORM CONTROLS
   ===================================================================== */
.row{display:flex;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.row label{min-width:140px;font-size:.88em;color:#b0b8c1}
.row label.wide{min-width:180px}
.val{min-width:48px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:#e6edf3}
input[type=range]{flex:1;min-width:150px;accent-color:#58a6ff}
input[type=number]{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;width:80px;text-align:center;font-size:.9em}
input[type=number]:focus{border-color:#58a6ff;outline:none}
select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:.9em;min-width:160px}
select:focus{border-color:#58a6ff;outline:none}
input[type=color]{width:40px;height:28px;border:1px solid #30363d;border-radius:4px;padding:1px;cursor:pointer;background:transparent}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}

/* =====================================================================
   BUTTONS
   ===================================================================== */
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.9em;transition:background .15s,border-color .15s}
button:hover{background:#30363d;border-color:#484f58}
button:active{background:#282e33}
button.primary{background:#238636;border-color:#2ea043;color:#fff}
button.primary:hover{background:#2ea043}
button.danger{background:#da3633;border-color:#f85149;color:#fff}
button.danger:hover{background:#f85149}
button.sm{padding:4px 10px;font-size:.8em}

/* =====================================================================
   TOGGLE SWITCH
   ===================================================================== */
.switch{position:relative;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#30363d;border-radius:11px;cursor:pointer;transition:background .2s}
.switch .track::after{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#c9d1d9;border-radius:50%;transition:transform .2s}
.switch input:checked+.track{background:#238636}
.switch input:checked+.track::after{transform:translateX(18px)}

/* =====================================================================
   MODE BADGE
   ===================================================================== */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75em;font-weight:600}
.badge.safe{background:#0d419d33;color:#58a6ff;border:1px solid #1f6feb55}
.badge.warn{background:#9e6a0333;color:#d29922;border:1px solid #9e6a0355}
.badge.danger{background:#f8514933;color:#f85149;border:1px solid #f8514955}

/* =====================================================================
   DMX BAR CHART
   ===================================================================== */
.bars-wrap{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px;margin-bottom:4px}
.bars-canvas{width:100%;height:120px;display:block}
.bars-labels{display:flex;justify-content:space-between;font-size:.65em;color:#7a8599;margin-top:4px}

/* =====================================================================
   LED PREVIEW STRIP
   ===================================================================== */
.led-strip{height:16px;background:#0d1117;border:1px solid #30363d;border-radius:4px;overflow:hidden}
.led-strip canvas{display:block;width:100%;height:16px}

/* =====================================================================
   PATCH TABLE
   ===================================================================== */
.patch-table{width:100%;border-collapse:collapse;font-size:.85em}
.patch-table th{text-align:left;padding:6px 8px;color:#8b949e;border-bottom:1px solid #30363d;font-weight:500}
.patch-table td{padding:6px 8px;border-bottom:1px solid #21262d}
.patch-table input[type=number]{width:60px}
.patch-table select{width:auto}
.patch-table .test-active{background:#23863622}
.patch-table button{padding:3px 8px}

/* =====================================================================
   OTA
   ===================================================================== */
.ota-bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin-top:8px}
.ota-bar .fill{height:100%;background:#58a6ff;width:0;transition:width .2s}
.ota-result{font-size:.85em;font-weight:600;margin-top:6px}
.ota-result.ok{color:#3fb950}
.ota-result.err{color:#f85149}

/* =====================================================================
   HELP TEXT
   ===================================================================== */
.help{font-size:.8em;color:#7a8599;line-height:1.6;margin-top:8px}

/* =====================================================================
   MODAL
   ===================================================================== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#161b22;border:2px solid #30363d;border-radius:12px;padding:24px;max-width:400px;width:90%;text-align:center}
.modal-box h3{font-size:1.1em;font-weight:700;margin-bottom:12px;color:#d29922}
.modal-box p{font-size:.9em;color:#b0b8c1;line-height:1.5;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:center}
.modal-btns button{flex:1;padding:10px;border-radius:8px;font-weight:600}

/* =====================================================================
   ANIMATIONS
   ===================================================================== */
@keyframes arrowPulse {
  0% { transform: translateX(-12px); opacity: 0; }
  30% { opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translateX(8px); opacity: 0; }
}
@keyframes arrowPulseOut {
  0% { transform: translateX(12px); opacity: 0; }
  30% { opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translateX(-8px); opacity: 0; }
}
.arrow-anim { animation: arrowPulse 0.7s ease-in-out infinite; }
.arrow-anim-out { animation: arrowPulseOut 0.7s ease-in-out infinite; }

/* =====================================================================
   SCROLLBAR
   ===================================================================== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <h1>DMX Sniffer</h1>
    <div class="status">
      <div class="dot" id="wifiDot"></div>
      <span id="modeLabel">Сниффер</span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs"></div>

  <!-- PANELS -->
  <div class="panels" id="panels"></div>
  <!-- MODAL -->
  <div class="modal-overlay" id="modeModal">
    <div class="modal-box">
      <h3 id="modalTitle">Внимание!</h3>
      <p id="modalText">Вы переходите в режим передачи DMX.</p>
      <div class="modal-btns">
        <button onclick="closeModeModal(false)" style="background:#21262d;border:1px solid #30363d;color:#b0b8c1">Отмена</button>
        <button onclick="closeModeModal(true)" style="background:#238636;border:1px solid #2ea043;color:#fff">Согласен</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   EVENT BUS
   ===================================================================== */
const Bus = (() => {
  const _h = {};
  return {
    on(e, fn) { (_h[e] ||= []).push(fn); },
    off(e, fn) { if (_h[e]) _h[e] = _h[e].filter(f => f !== fn); },
    emit(e, d) { (_h[e] || []).forEach(fn => fn(d, e)); }
  };
})();

/* =====================================================================
   STORE (реактивное состояние)
   ===================================================================== */
const Store = (() => {
  const _s = {}, _sub = {};
  return {
    get(k) { return _s[k]; },
    set(k, v) {
      if (_s[k] === v) return;
      _s[k] = v;
      (_sub[k] || []).forEach(fn => fn(v, k));
    },
    sub(k, fn) { (_sub[k] ||= []).push(fn); },
    all() { return Object.assign({}, _s); }
  };
})();

/* =====================================================================
   API LAYER
   ===================================================================== */
const API = {
  async get(url) {
    try {
      const r = await fetch(url);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  },
  async post(url, data) {
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: data instanceof Blob ? {} : { 'Content-Type': 'application/json' },
        body: data instanceof Blob ? data : JSON.stringify(data)
      });
      return r.ok ? await r.json() : null;
    } catch { return null; }
  },
  async getBlob(url) {
    try {
      const r = await fetch(url);
      return r.ok ? await r.arrayBuffer() : null;
    } catch { return null; }
  }
};

/* =====================================================================
   MOCK DATA (для превью без ESP32)
   ===================================================================== */
const MOCK = {
  dmx0: new Uint8Array(512), dmx1: new Uint8Array(512),
  fixtures: [[255,0,0],[0,255,0],[0,0,255],[255,255,0]],
  state: {
    mode:'sniffer', led_count:100, led_count2:0,
    reverse:false, shift:0, led_mode:'parallel',
    interpolate:true, channel_order:0,
    fallback:{r:0,g:0,b:255}, timeout:100,
    dmx0:1, dmx1:1, patch_count:4
  },
  _t: 0,
  tick() {
    this._t += 0.03;
    for (let i = 0; i < 512; i++) {
      this.dmx0[i] = Math.max(0, Math.min(255,
        Math.round(128 + 127 * Math.sin(this._t + i * 0.1))));
      this.dmx1[i] = Math.max(0, Math.min(255,
        Math.round(128 + 127 * Math.cos(this._t + i * 0.15))));
    }
    this.fixtures = this.fixtures.map((f, i) => [
      Math.max(0, Math.min(255, Math.round(128 + 127 * Math.sin(this._t + i)))),
      Math.max(0, Math.min(255, Math.round(128 + 127 * Math.sin(this._t + i + 2)))),
      Math.max(0, Math.min(255, Math.round(128 + 127 * Math.sin(this._t + i + 4))))
    ]);
  }
};

/* =====================================================================
   MODULE SYSTEM
   ===================================================================== */
const _modules = [];
const _tabs = [];

function registerModule(mod) {
  _modules.push(mod);
  if (mod.tab) {
    _tabs.push({
      label: mod.tab.label,
      id: mod.name,
      show: mod.tab.show || (() => true),
      icon: mod.tab.icon || ''
    });
  }
}

/* =====================================================================
   TAB MANAGER
   ===================================================================== */
function initTabs() {
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');

  function render() {
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = '';

    _tabs.forEach(t => {
      if (!t.show()) return;

      const tab = document.createElement('div');
      tab.className = 'tab' + (Store.get('_activeTab') === t.id ? ' active' : '');
      tab.textContent = t.label;
      tab.onclick = () => { Store.set('_activeTab', t.id); render(); };
      tabsEl.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'panel' + (Store.get('_activeTab') === t.id ? ' active' : '');
      panel.id = 'panel-' + t.id;
      panelsEl.appendChild(panel);
    });

    _modules.forEach(m => {
      if (m.tab && m.panel && Store.get('_activeTab') === m.name) {
        const el = document.getElementById('panel-' + m.name);
        if (el) el.innerHTML = m.panel;
        if (m.mounted) m.mounted();
      }
    });
  }

  Store.sub('_activeTab', render);
  if (!Store.get('_activeTab') && _tabs.length) {
    Store.set('_activeTab', _tabs[0].id);
  }
  render();
}

/* =====================================================================
   DRAW HELPERS
   ===================================================================== */
function drawBars(canvas, data, offset, count) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.parentElement.clientWidth;
  const h = canvas.height = 100;
  const bw = w / count;

  const img = ctx.createImageData(w, h);
  const d = img.data;

  for (let x = 0; x < count && x + offset < 512; x++) {
    const v = data[x + offset] || 0;
    const bh = Math.max(Math.round(v / 255 * h), 1);
    const cr = Math.round(40 + v * 0.84);
    const cb = Math.round(v * 0.7);
    const x0 = Math.floor(x * bw);
    const x1 = Math.floor((x + 1) * bw);

    for (let px = x0; px < x1; px++) {
      for (let y = h - bh; y < h; y++) {
        const p = (y * w + px) * 4;
        d[p] = cr; d[p+1] = cr; d[p+2] = cb; d[p+3] = 255;
      }
      for (let y = 0; y < h - bh; y++) {
        const p = (y * w + px) * 4;
        d[p] = 13; d[p+1] = 17; d[p+2] = 23; d[p+3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function drawLedStrip(canvas, colors) {
  if (!canvas || !colors.length) return;
  const n = colors.length;
  canvas.width = Math.max(n, 1);
  canvas.height = 12;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(n, 1);
  const d = img.data;
  for (let i = 0; i < n; i++) {
    const p = i * 4;
    d[p] = colors[i][0]; d[p+1] = colors[i][1]; d[p+2] = colors[i][2]; d[p+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

/* =====================================================================
   MODULE: SETTINGS
   ===================================================================== */
registerModule({
  name: 'settings',
  tab: { label: 'Настройки', icon: '⚙' },
  panel: `
    <div class="card">
      <h3>DMX сигнал</h3>
      <div style="display:flex;gap:12px">
        <div id="dmxBox0" style="flex:1;background:transparent;border:2px solid #30363d;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s;overflow:hidden;position:relative">
          <div style="position:relative;z-index:1"><div style="font-weight:700;font-size:1em;margin-bottom:4px">DMX PORT 1</div><div id="dmxLabel0" style="font-size:.85em;color:#e6edf3">нет сигнала</div></div>
          <div style="display:flex;align-items:center;gap:2px;position:relative;z-index:1">
            <svg id="dmxArrow0" width="30" height="20" viewBox="0 0 30 20" fill="none" style="opacity:0;transition:opacity .3s">
              <path d="M2 10 L22 10 M16 4 L24 10 L16 16" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg id="dmxIcon0" width="38" height="38" viewBox="0 0 38 38" fill="none" stroke-width="1.5" style="flex-shrink:0">
              <circle cx="19" cy="19" r="15" stroke="#7a8599"/>
              <circle cx="19" cy="19" r="12" stroke="#7a8599"/>
              <circle id="dmxPin0a" cx="19" cy="12" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <circle id="dmxPin0b" cx="13" cy="23" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <circle id="dmxPin0c" cx="25" cy="23" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <line x1="19" y1="4" x2="19" y2="7" stroke="#7a8599" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div id="dmxBox1" style="flex:1;background:transparent;border:2px solid #30363d;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s;overflow:hidden;position:relative">
          <div style="position:relative;z-index:1"><div style="font-weight:700;font-size:1em;margin-bottom:4px">DMX PORT 2</div><div id="dmxLabel1" style="font-size:.85em;color:#e6edf3">нет сигнала</div></div>
          <div style="display:flex;align-items:center;gap:2px;position:relative;z-index:1">
            <svg id="dmxArrow1" width="30" height="20" viewBox="0 0 30 20" fill="none" style="opacity:0;transition:opacity .3s">
              <path d="M2 10 L22 10 M16 4 L24 10 L16 16" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg id="dmxIcon1" width="38" height="38" viewBox="0 0 38 38" fill="none" stroke-width="1.5" style="flex-shrink:0">
              <circle cx="19" cy="19" r="15" stroke="#7a8599"/>
              <circle cx="19" cy="19" r="12" stroke="#7a8599"/>
              <circle id="dmxPin1a" cx="19" cy="12" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <circle id="dmxPin1b" cx="13" cy="23" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <circle id="dmxPin1c" cx="25" cy="23" r="2.5" stroke="#7a8599" fill="#0d1117"/>
              <line x1="19" y1="4" x2="19" y2="7" stroke="#7a8599" stroke-width="2"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="help" style="padding:8px 16px;margin:0 0 4px 0;font-size:.85em">Трансляция — приём DMX → WS2812. LED Test — прямое управление лентой. DMX Test — генерация. Patch — настройка приборов.</div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;border-bottom:1px solid #30363d">
        <button id="modeTab0" onclick="ModuleAPI.setMode('sniffer')" style="flex:1;padding:12px 8px;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .15s;text-align:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 4px"><polygon points="6,3 20,12 6,21"/></svg>
          <div style="font-size:.95em;font-weight:600;color:#b0b8c1">Трансляция</div>
        </button>
        <button id="modeTab2" onclick="ModuleAPI.setMode('led_test')" style="flex:1;padding:12px 8px;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .15s;text-align:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 4px"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
          <div style="font-size:.95em;font-weight:600;color:#b0b8c1">LED Test</div>
        </button>
        <div style="width:1px;background:#30363d;flex-shrink:0"></div>
        <button id="modeTab1" onclick="ModuleAPI.setMode('tester')" style="flex:1;padding:12px 8px;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .15s;text-align:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 4px"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15 4.5L9 10l3 3 5.5-5.5a2.12 2.12 0 0 0-3-3z"/><path d="M9 10L4.5 14.5a2.12 2.12 0 0 0 3 3L12 13"/></svg>
          <div style="font-size:.95em;font-weight:600;color:#b0b8c1">DMX Test</div>
        </button>
        <button id="modeTab3" onclick="ModuleAPI.setMode('patch')" style="flex:1;padding:12px 8px;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .15s;text-align:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 4px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <div style="font-size:.95em;font-weight:600;color:#b0b8c1">Patch</div>
        </button>
      </div>
    </div>

    <!-- === INLINE PANELS === -->
    <div id="inlineDmxTest" style="display:none;border:2px solid #d29922;padding:10px;margin-bottom:4px;border-radius:8px">
      <div class="card">

        const arrow = ie('dmxArrow'+p);

        const path = arrow.querySelector('path');

          arrow.classList.remove('arrow-anim-out');
          arrow.classList.add('arrow-anim');
          if (path) { path.setAttribute('stroke', '#3fb950'); path.setAttribute('d', PATH_RIGHT); }
        }
      });
      Bus.emit('dmx:data', { p0: Store.get('_lastDmx0') || new Uint8Array(512), p1: Store.get('_lastDmx1') || new Uint8Array(512) });
    });
    // Trigger initial mode render
    { const m = Store.get('mode') || 'sniffer';
      const modes = ['sniffer','tester','led_test','patch'];
      const colors = ['#58a6ff','#d29922','#f85149','#a371f7'];

        const label = tab.querySelector('div:last-child');

      if (ie('inlineLedTest')) ie('inlineLedTest').style.display = m === 'led_test' ? '' : 'none';
      if (ie('inlinePatch')) ie('inlinePatch').style.display = m === 'patch' ? '' : 'none';
      if (ie('snifferSettings')) ie('snifferSettings').style.display = m === 'sniffer' ? '' : 'none';
      const isOutInit = (m === 'tester' || m === 'patch');
      const PATH_RIGHT = 'M2 10 L22 10 M16 4 L24 10 L16 16';

        const arrow = ie('dmxArrow'+p);

          arrow.classList.remove('arrow-anim-out');

          if (path) { path.setAttribute('stroke', '#3fb950'); path.setAttribute('d', PATH_RIGHT); }
        }

    // Initial render
    Store.sub('led_mode', v => { if ($('ledMode')) $('ledMode').value = v; });

    Store.sub('interpolate', v => { if ($('ledInterpolate')) $('ledInterpolate').checked = v; });

  }
});

registerModule({
  name: 'tester',
  init() {
    const $ = id => document.getElementById(id);
    function sync() {
      const m = document.querySelector('input[name=txMode]:checked')?.value || 'point';
      const cr = document.getElementById('txCountRow'); if (cr) cr.style.display = m === 'fill' ? '' : 'none';
      const r = +$('txR')?.value, g = +$('txG')?.value, b = +$('txB')?.value;
      const pv = $('txPreview'); if (pv) pv.style.background = `rgb(${r},${g},${b})`;
      const isPx = document.querySelector('input[name=txAddr]:checked')?.value === 'px';
      const al = $('txAddrLabel'); if (al) al.textContent = isPx ? 'Пиксель:' : 'Канал:';
      const addr = isPx ? (+$('txCh')?.value - 1) * 3 + 1 : +$('txCh')?.value;
      ModuleAPI.dmxTest({ port: +$('txPort')?.value, channel: Math.min(addr,512), r, g, b, mode:m, count: +$('txCount')?.value });
    }
    ['txPort','txR','txG','txB','txCh','txCount'].forEach(id => { const el = $(id); if(el) el.oninput = sync; });
    const tc = $('txColor'); if(tc) tc.oninput = e => { const h=e.target.value; $('txR').value=parseInt(h.slice(1,3),16); $('txG').value=parseInt(h.slice(3,5),16); $('txB').value=parseInt(h.slice(5,7),16); sync(); };
    document.querySelectorAll('input[name=txAddr],input[name=txMode]').forEach(el => el.onchange = sync);
  }
});

   MODE MODAL
   ===================================================================== */
let _pendingMode = null;
let _modalCallback = null;

const modeWarnings = {
  tester: {
    title: '⚠️ Режим передачи DMX',
    text: 'Вы переходите в режим <b>генерации DMX сигнала</b>.<br><br>Отключите контроллер от шины DMX перед продолжением!'
  },
  patch: {
    title: '⚠️ Режим Патч',
    text: 'Вы переходите в режим <b>сканирования и настройки приборов</b>.<br><br>Убедитесь, что DMX кабели подключены правильно.'
  },
  led_test: {
    title: '⚠️ Тест LED ленты',
    text: 'Вы переходите в режим <b>прямого управления WS2812</b>.<br><br>Лента будет реагировать на команды из интерфейса.'
  }
};

function showModeModal(mode) {
  const w = modeWarnings[mode];
  if (!w) { ModuleAPI._setMode(mode); return; }
  _pendingMode = mode;
  document.getElementById('modalTitle').textContent = w.title;
  document.getElementById('modalText').innerHTML = w.text;
  document.getElementById('modeModal').classList.add('open');
}

function closeModeModal(confirmed) {
  document.getElementById('modeModal').classList.remove('open');
  if (confirmed && _pendingMode) {
    ModuleAPI._setMode(_pendingMode);
  }
  _pendingMode = null;
}

/* =====================================================================
   MODULE API (вызывается из HTML onclick)
   ===================================================================== */
const ModuleAPI = {
  async setMode(mode) {
    showModeModal(mode);
  },
  async _setMode(mode) {
    await API.post('/api/mode', { mode });
    initTabs();
    Store.set('mode', mode);
  },
  async setLeds(strip) {
    const count = strip === 0
      ? +(document.getElementById('ledCount1')?.value || 100)
      : +(document.getElementById('ledCount2')?.value || 0);
    await API.post('/api/leds', { strip, count });
    Store.set(strip === 0 ? 'led_count' : 'led_count2', count);
  },
  async setLedConfig(cfg) {
    if (cfg.reverse !== undefined) Store.set('reverse', cfg.reverse);
    if (cfg.shift !== undefined) Store.set('shift', cfg.shift);
    if (cfg.mode) Store.set('led_mode', cfg.mode);
    if (cfg.interpolate !== undefined) Store.set('interpolate', cfg.interpolate);
    await API.post('/api/led_config', cfg);
  },
  async setFixture(cfg) {
    await API.post('/api/fixture', cfg);
  },
  async dmxTest(cfg) {
    await API.post('/api/dmx_test', cfg);
  },
  async save() {
    await API.post('/api/save');
    const el = document.getElementById('otaResult');
    if (el) { el.textContent = 'Сохранено!'; el.className = 'ota-result ok'; setTimeout(() => el.textContent = '', 2000); }
  },
  async reboot() { await API.post('/api/reboot'); },
  async ota(file) {
    const fill = document.getElementById('otaFill');
    const result = document.getElementById('otaResult');
    result.textContent = 'Загрузка...'; result.className = 'ota-result';
    fill.style.width = '0%';
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = Math.round(e.loaded/e.total*100) + '%'; };
    xhr.onload = () => {
      try {
        const j = JSON.parse(xhr.responseText);
        if (j.ok) { result.textContent = 'OK, перезагрузка...'; result.className = 'ota-result ok'; setTimeout(() => location.reload(), 2000); }
        else { result.textContent = 'Ошибка: ' + (j.error || '?'); result.className = 'ota-result err'; }
      } catch { result.textContent = 'Ошибка HTTP'; result.className = 'ota-result err'; }
    };
    xhr.onerror = () => { result.textContent = 'Ошибка сети'; result.className = 'ota-result err'; };
    xhr.open('POST', '/api/ota');
    xhr.send(file);
  },
  patchData: [],
  patchRenderTable() {
    const body = document.getElementById('patchBody');
    const total = document.getElementById('patchTotal');
    if (!body) return;
    body.innerHTML = '';
    this.patchData.forEach((e, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i+1}</td><td>Порт ${e.port+1}</td><td>${e.addr}</td><td><button onclick="ModuleAPI.patchDelOne(${i})" style="color:#f85149;background:none;border:none;cursor:pointer">✕</button></td>`;
      body.appendChild(tr);
    });
    if (total) total.textContent = this.patchData.length;
  },
  patchAddrForFixture(port, num) {
    let n = 0;
    for (const e of this.patchData) { if (e.port === port) n++; if (n === num) return e.addr; }
    return 0;
  },
  patchAddGroup() {
    const port = +(document.getElementById('patchPortGroup')?.value || 0);
    const count = +(document.getElementById('patchCountAdd')?.value || 1);
    const startAddr = +(document.getElementById('patchAddrStart')?.value || 1);
    for (let i = 0; i < count; i++) {
      this.patchData.push({ port, addr: startAddr + i * 3 });
    }
    this.patchRenderTable();
  },
  patchDelGroup() {
    const from = +(document.getElementById('patchDelFrom')?.value || 1);
    const to = +(document.getElementById('patchDelTo')?.value || 1);
    this.patchData = this.patchData.filter((_, i) => i < from - 1 || i >= to);
    this.patchRenderTable();
  },
  patchDelOne(idx) {
    this.patchData.splice(idx, 1);
    this.patchRenderTable();
  },
  patchNav(dir) {
    const el = document.getElementById('patchTestNum');
    if (!el) return;
    el.value = Math.min(170, Math.max(1, +(el.value || 1) + dir));
  },
  async patchTest() {
    const num = +(document.getElementById('patchTestNum')?.value || 1);
    const entry = this.patchData[num - 1];
    if (!entry) return;
    await API.post('/api/dmx_test', { port: entry.port, channel: entry.addr, r: 255, g: 255, b: 255, mode: 'point', count: 3 });
  },
  patchAddCurrent() {
    const el = document.getElementById('patchTestNum');
    const num = +(el?.value || 1);
    const port = +(document.getElementById('patchPort')?.value || 0);
    const startAddr = +(document.getElementById('patchAddrStart')?.value || 1);
    const exists = this.patchData.find(e => e.port === port && e.addr === startAddr + (num - 1) * 3);
    if (!exists) {
      this.patchData.push({ port, addr: startAddr + (num - 1) * 3 });
      this.patchRenderTable();
    }
    if (el) el.value = Math.min(170, num + 1);
  },
  async patchSave() {
    const csv = this.patchData.map(e => `${e.port},${e.addr}`).join('\n');
    await API.post('/api/patch', { csv });
  },
  async patchLoad() {
    const r = await fetch('/api/patch');
    const text = await r.text();
    this.patchData = text.trim().split('\n').filter(l => l).map(l => {
      const [port, addr] = l.split(',').map(Number);
      return { port, addr };
    });
    this.patchRenderTable();
  },
};

/* =====================================================================
   POLLING / SSE (mock для превью)
   ===================================================================== */
function startPolling() {
  setInterval(() => {
    MOCK.tick();
    Store.set('_lastDmx0', MOCK.dmx0);
    Store.set('_lastDmx1', MOCK.dmx1);
    Bus.emit('dmx:data', { p0: MOCK.dmx0, p1: MOCK.dmx1 });
    Bus.emit('fixture:colors', MOCK.fixtures);
    Store.set('dmx0', 1);
    Store.set('dmx1', 1);
  }, 50);
}

/* =====================================================================
   INIT
   ===================================================================== */
Store.set('mode', 'sniffer');
Store.set('led_count', 100);
Store.set('led_count2', 0);
Store.set('reverse', false);
Store.set('shift', 0);
Store.set('led_mode', 'parallel');
Store.set('interpolate', true);

initTabs();
startPolling();
</script>
